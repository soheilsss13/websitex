<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>این مسیر پیدا نشد — x</title>
  <style>
    @font-face{font-family:Vazirmatn;src:url("assets/fonts/vazirmatn-arabic-variable.woff2") format("woff2");font-style:normal;font-weight:100 900;font-display:swap}
    @font-face{font-family:Inter;src:url("assets/fonts/inter-latin-variable.woff2") format("woff2");font-style:normal;font-weight:100 900;font-display:swap}
    *{box-sizing:border-box}html,body{min-width:320px;min-height:100%;margin:0}body{min-height:100svh;display:flex;flex-direction:column;background:#f5f4ef;color:#191a19;font-family:Vazirmatn,sans-serif}.shell{width:min(calc(100% - 64px),1320px);margin-inline:auto}.head{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(25,26,25,.18)}.brand{display:inline-flex;align-items:center;gap:9px;color:inherit;text-decoration:none}.brand img{width:39px;height:39px}.brand-copy{display:flex;flex-direction:column;align-items:flex-start;line-height:1}.brand-copy strong{font:700 25px/1 Inter,sans-serif;letter-spacing:-.09em}.brand-copy small{margin-top:5px;color:#676761;font-size:9px}.meta{color:#77766f;font:9px/1.4 monospace;letter-spacing:.14em;direction:ltr}.main{position:relative;flex:1;display:grid;min-height:620px;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:center;gap:40px;overflow:hidden}.copy{position:relative;z-index:2}.eyebrow{color:#4c58ee;font-size:11px}.number{margin:16px 0 0;color:transparent;font:800 clamp(150px,23vw,310px)/.8 Inter,sans-serif;letter-spacing:-.12em;-webkit-text-stroke:1px rgba(25,26,25,.22);direction:ltr}.copy h1{margin:13px 0 10px;font-size:clamp(28px,4.2vw,50px);font-weight:650;letter-spacing:-.06em}.copy p{max-width:390px;margin:0 0 25px;color:#676761;font-size:13px;line-height:2}.home-link{display:inline-flex;align-items:center;gap:17px;min-height:48px;padding:0 20px;border-radius:999px;background:#191a19;color:#fff;font-size:12px;text-decoration:none;transition:background .2s,transform .2s}.home-link:hover{background:#4c58ee;transform:translateY(-2px)}.icon-arrow{display:inline-grid;width:12px;height:12px;place-items:center;flex:none}.icon-arrow svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.art{position:relative;min-height:410px;display:grid;place-items:center}.art img{position:absolute;width:min(43%,270px);height:auto;filter:drop-shadow(0 20px 24px rgba(52,78,124,.12));animation:float 7s ease-in-out infinite}.art img:nth-child(1){left:16%;top:24%;width:53%;transform:rotate(-25deg)}.art img:nth-child(2){right:13%;top:14%;width:30%;animation-delay:-2s}.art img:nth-child(3){right:18%;bottom:13%;width:27%;animation-delay:-4s}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -12px}}.foot{display:flex;justify-content:space-between;gap:20px;align-items:center;min-height:54px;border-top:1px solid rgba(25,26,25,.18);color:#77766f;font:8px/1.4 monospace;letter-spacing:.12em;direction:ltr}@media(max-width:680px){.shell{width:calc(100% - 40px)}.head{height:64px}.brand img{width:34px;height:34px}.brand-copy strong{font-size:22px}.meta{font-size:8px}.main{min-height:calc(100svh - 118px);grid-template-columns:1fr;gap:0;padding-block:34px 12px}.copy{align-self:end}.number{margin-top:18px;font-size:clamp(125px,43vw,205px)}.copy h1{font-size:31px}.copy p{font-size:12px}.art{min-height:260px;grid-row:1;max-height:36vh}.art img:nth-child(1){width:46%;left:23%;top:16%}.art img:nth-child(2){width:26%;right:16%;top:4%}.art img:nth-child(3){width:24%;right:18%;bottom:4%}.foot{font-size:7px}}@media(prefers-reduced-motion:reduce){.art img{animation:none}}
  </style>
</head>
<body>
  <header class="head shell"><a class="brand" href="./" data-home aria-label="x، خانه"><img src="assets/logo.svg" alt=""><span class="brand-copy"><strong>x</strong><small>سرمایه‌گذاری جسورانه</small></span></a><span class="meta">404 / NOT FOUND</span></header>
  <main class="main shell">
    <div class="copy"><span class="eyebrow">این صفحه هنوز ساخته نشده</span><div class="number">404</div><h1>مسیر را گم کردیم.</h1><p>این نشانی به صفحه‌ای نمی‌رسد. از خانه دوباره شروع کنیم؛ ایده‌ی بعدی هنوز منتظر است.</p><a class="home-link" href="./" data-home>بازگشت به خانه <span class="icon-arrow" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 12 12 4M5 4h7v7"/></svg></span></a></div>
    <div class="art" aria-hidden="true"><img data-shard="01" src="assets/images/crystal-shard-01.png" alt=""><img data-shard="02" src="assets/images/crystal-shard-02.png" alt=""><img data-shard="03" src="assets/images/crystal-shard-03.png" alt=""></div>
  </main>
  <footer class="foot shell"><span>IDEA / INDUSTRY</span><span>© X CAPITAL</span></footer>
  <script>
    (() => {
      const first = location.pathname.split('/').filter(Boolean)[0];
      const base = first === 'websitex' ? '/websitex/' : '/';
      document.querySelectorAll('[data-home]').forEach((link) => { link.href = base; });
      document.querySelectorAll('[data-shard]').forEach((image) => {
        image.src = `${base}assets/images/crystal-shard-${image.dataset.shard}.png`;
      });
    })();
  </script>
</body>
</html>
