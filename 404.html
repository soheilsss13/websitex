  <style>

))}@keyframes error-float{0%,100%{transform:translate(-50%,-50%) rotate(-12deg)}50%{transform:translate(-50%,-53%) rotate(-8deg)}}.error-copy{max-width:720px;padding:0 20px}.eyebrow{color:#1fa89a;font-size:10px}.error-number{font:800 clamp(140px,28vw,310px)/.78 Inter,Arial,sans-serif;letter-spacing:-.13em;color:transparent;-webkit-text-stroke:1px rgba(226,185,107,.62);direction:ltr;margin:26px 0 12px}.error-copy h1{font-size:clamp(32px,6vw,62px);line-height:1.3;margin:0 0 11px;letter-spacing:-.04em}.error-copy p{max-width:430px;margin:0 auto 24px;font-size:13px;color:rgba(255,255,255,.55);line-height:1.9}.home-button{min-width:210px;min-height:54px;padding:0 25px;display:inline-flex;align-items:center;justify-content:center;gap:14px;border-radius:999px;background:#1fa89a;color:#04201d;text-decoration:none;font-size:13px;font-weight:700;transition:transform .25s ease,background .25s ease}.home-button:hover{background:#e2b96b;transform:translateY(-2px)}.home-button b{font:19px Inter,Arial,sans-serif}.error-footer{display:flex;justify-content:space-between;gap:14px;border-top:1px solid rgba(255,255,255,.1);padding:16px 0 20px;font-size:8px;color:rgba(255,255,255,.34)}@media(max-width:600px){.shell{width:calc(100% - 40px)}.error-head{height:68px}.brand svg{width:37px;height:37px}.brand-copy strong{font-size:22px}.brand-copy small{font-size:8px}.error-head-note{font-size:7px}.broken-crystal{width:82vw;top:41%}.error-copy{padding-top:80px}.error-number{font-size:46vw;margin:30px 0 17px}.error-copy h1{font-size:35px}.error-copy p{font-size:11px}.error-footer{font-size:6px}}@media(prefers-reduced-motion:reduce){.broken-crystal{animation:none}}
  </style>
</head>

    <div class="error-copy"><span class="eyebrow">A WRONG TURN IN THE DARK</span><div class="error-number">404</div><h1>این مسیر به جایی نمی‌رسد.</h1><p>شاید مسیر عوض شده، شاید این صفحه هنوز ساخته نشده است. بیایید دوباره از همان جرقه شروع کنیم.</p><a class="home-button" href="/" data-home>بازگشت به خانه <b>↗</b></a></div>

  <script>
    (() => {
      const segments = location.pathname.split('/').filter(Boolean);
      const home = segments[0] === 'websitex' ? '/websitex/' : '/';
      document.querySelectorAll('[data-home]').forEach((link) => { link.href = home; });
      const errorImage = document.querySelector('[data-error-image]');
      if (errorImage) errorImage.src = `${home}assets/images/404-crystal.jpg`;
    })();
